name: Build Unity with Cake 🚀

on:
  push:
    branches: [master, dev]

jobs:
  build-android:
    name: Build Android via Cake
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Cake inside Unity environment
        uses: cake-build/cake-action@v3
        with:
          verbosity: Diagnostic
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: artifacts