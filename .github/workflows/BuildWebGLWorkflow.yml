name: Build WebGL Workflow
run-name: Building your WebGL Telegram Game 👻📦

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Build WebGL
        run: '& "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe" -quit -batchmode -projectPath . -executeMethod Builder.BuildWebGL -logFile build.log'
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: "D:/Projects/Unity/CICDLearn/artifacts"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: ./dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true