name: Log Actor Data WorkFlow
run-name: Log Actor
on: 
  - push
  - workflow_dispatch
    
jobs: 
  LogData:
    runs-on: ubuntu-latest
    name: "Log common actor data"
    steps:
      - uses: actions/checkout@v5
      - id: foo
        uses: common-log-custom-action@main
        with:
          who-to-log: "Greet me!"
        run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env: 
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}