name: Log Actor Data WorkFlow
run-name: Log Actor
on: push

env:
  ACTOR: ${{ github.actor }}
  ACTOR_ID: ${{ github.actor_id }}
  EVENT: ${{ github.event_name }}
  JOB: ${{ github.job }}
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  LogCurrentActor: &common_job
    runs-on: ubuntu-latest
    steps:
      - name: Common Log
      - run: |
          echo "Current ACTOR - $ACTOR"
          echo "Current EVENT - $EVENT"
          echo "Current JOB - $JOB"
          echo "Current TRIGGERING_ACTOR - $TRIGGERING_ACTOR"
  DetailedActorLog: *common_job