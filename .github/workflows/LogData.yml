name: Log Actor Data WorkFlow
run-name: Log Actor📱
on: push

env:
    ACTOR: ${{ github.actor }}
    ACTOR_ID: ${{ github.actor_id }}
    EVENT: ${{ github.event_name }}
    JOB: ${{ github.job }}
    TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:    
  LogCurrentActor: 
    runs-on: ubuntu-latest    
    steps: &common_actor_log
      - run: echo "Current ACTOR - $ACTOR"
      - run: echo "Current EVENT - $EVENT"
      - run: echo "Current JOB - $JOB"
      - run: echo "Current TRIGGERING_ACTOR - $TRIGGERING_ACTOR"
  DetailedActorLog:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log current actor"
          echo "------------------"          
      - *common_actor_log
      - run: |
          echo "Actor: $ACTOR"
          echo "Actor's id $ACTOR_ID"