name: Log Actor Data WorkFlow
run-name: Log Actor
on: push

env:
    ACTOR: ${{ github.actor }}
    ACTOR_ID: ${{ github.actor_id }}
    EVENT: ${{ github.event_name }}
    JOB: ${{ github.job }}
    TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:    
  LogCurrentActor: 
    runs-on: ubuntu-latest
    steps:
      - &common-actor-log
      - run: echo "Current ACTOR - ACTOR"
  DetailedActorLog:
    runs-on: ubuntu-latest
    steps:
      - *common-actor-log
      - run: |
          echo "Log current actor"
          echo "------------------"          
      - run: |
          echo "Actor: $ACTOR"
          echo "Actor's id $ACTOR_ID"