name: Log Actor Data WorkFlow
run-name: Log Actor
on: 
  - push
  - workflow_dispatch
    
jobs: 
  LogData:
    runs-on: ubuntu-latest
    name: "Log common actor data"
    steps:
      - name: Checkout custom action repo
        uses: actions/checkout@v5
        with:
          repository: TrapTap277/common-log-custom-action
          token: ${{ secrets.ACCESS_TOKEN_SECRET }}
      - name: Log Greetings
        id: foo
        uses: ./action
        with:
          who-to-log: "Greet me!"
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}
      - name: Echo random
        run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}